    const q2 = qMul(qAxisJS([0, 1, 0], 2.1), qAxisJS([1, 0, 0], Math.PI - .25));
    const s1 = 1.75, s2 = 1.1;
    u.uI = [1.5, restY(q1, s1), .3, s1, -2.6, restY(q2, s2), -4.0, s2];
    u.uQ = [...q1, ...q2];
    u.uA = [...a, 0, ...a, 0];
    u.uIN = 2;
    u.uSigmaK *= 1.4;
    u.uDisp = t.disp * 1.8;
    cam = look3([-.6, 3.9, 7.0], [.75, .75, -.2], 2.4, .12);
    u.uKeyDir = day ? [-.5, .9, .4] : [-.55, .75, .35];
  } else if (scene === 'slab') {
    cam = look3([0, 3.8, 5.0], [0, 0, -1.2], 2.5, .1);
    u.uKeyCol = u.uKeyCol.map(v => v * .85);
    u.uKeyDir = day ? [-.35, .8, -.5] : [-.25, .55, -.8];
    if (t.slug === 'fluorite') { u.uPat = 1; u.uBand = .35; }
    if (t.slug === 'watermelon-tourmaline') { u.uSlice = 1; table = day ? 6 : 1; cam = look3([0, 6.2, 4.6], [.5, 0, -1.2], 2.4, .08); }
  }
  // The highest point of the scene, so a shadow ray can stop above it.
  if (scene === 'specimen') { const ex = extents(u); u.uTopY = ex.maxY + .3; }
  else if (scene === 'wordmark' || scene === 'rough') { u.uTopY = 1.6; u.uBounces = 2; }
  else if (scene === 'gem') u.uTopY = 4.5;
  let [tableA, tableB] = tables(table);
  // Pale pieces vanish on a white table in the day, so they get a gray one.
  const lum = lin(col).reduce((a, v, i) => a + v * [.2126, .7152, .0722][i], 0);
  if (day && (scene === 'wordmark' || scene === 'rough') && lum > .3) { tableA = mix(tableA, '#5e5a55', .72); tableB = mix(tableB, '#6e6962', .72); }
  u.uTable = table; u.cTableA = lin(tableA); u.cTableB = lin(tableB);
  u.uCamPos = cam.pos; u.uCamTarget = cam.target; u.uFocal = cam.focal; u.uAperture = cam.aperture; u.uFocus = cam.focus;
  return { u, ints, arrays, grade: { shadow: lin(mix(c.darker_background, '#808080', .5)), high: lin(mix(c.accent, '#ffffff', .7)) } };
}

// The box around the specimen, from the corners of every crystal and the
// size of the rock or the body. hero is the middle of the largest crystal.
function extents(u) {
  const pts = [];
  const planes = [];
  for (let k = 0; k < u.uPlN; k++) planes.push(u.uPl.slice(k * 4, k * 4 + 4));
  const verts = u.uPlN ? vertices(planes, [1, 1, 1]) : [];
  let hero = null, heroR = 0;
  for (let i = 0; i < u.uIN; i++) {
    const I = u.uI.slice(i * 4, i * 4 + 4), Q = u.uQ.slice(i * 4, i * 4 + 4), A = u.uA.slice(i * 4, i * 4 + 4);
    const at = v => { const w = qApply(Q, v); return [I[0] + w[0] * I[3], I[1] + w[1] * I[3], I[2] + w[2] * I[3]]; };
    let local = [];
    if (A[3] === 0) local = verts.map(at);
    else if (A[3] === 1) local = [at([0, 0, 0]), at([0, A[1], 0])];
    else { const r = (A[3] === 3 ? 1.2 : A[0]) * I[3]; local = [[I[0] - r, I[1] - r, I[2]], [I[0] + r, I[1] + r, I[2]]]; }
    pts.push(...local);
    const c = local.reduce((a, p) => a.map((v, k) => v + p[k] / local.length), [0, 0, 0]);
    const rr = Math.max(...local.map(p => Math.hypot(p[0] - c[0], p[1] - c[1], p[2] - c[2])));
    if (rr > heroR) { heroR = rr; hero = c; }
  }
  const R = u.uRock, S = u.uRockS;
  if (R[3] > 0 || [2, 3, 4, 5, 6].includes(u.uHabit)) {
    const s = u.uHabit === 3 ? [R[3], R[3], R[3]] : S;
    pts.push([R[0] - s[0], R[1] + s[1], R[2]], [R[0] + s[0], R[1] + s[1], R[2]]);
    if (!hero) { hero = [R[0], R[1] + s[1] * .4, R[2]]; heroR = Math.max(...s) * .7; }
  }
  if (!pts.length) pts.push([-1, 0, 0], [1, 2, 0]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), zs = pts.map(p => p[2]);
  return { minX: Math.min(...xs), maxX: Math.max(...xs), maxY: Math.max(...ys), cz: (Math.min(...zs) + Math.max(...zs)) / 2, hero: hero || [0, 1, 0], heroR: heroR || 1 };
}

// ---------- the specimen ----------

// Builds the instances of the specimen: crystals on a host rock, a massive
// stone, balls, branches or a geode. Sizes are in the units of the scene,
// where the specimen is about 4 units wide.
function specimen(t, r, u, planes, aspect, day) {
  const out = { uI: [], uQ: [], uA: [], uIN: 0, uHabit: 0, uRock: [0, .85, 0, 1], uRockS: [2.3, .85, 1.7] };
  const add = (pos, q, s, a, type = 0) => {
    if (out.uIN >= 24) return;
    out.uI.push(...pos, s); out.uQ.push(...q); out.uA.push(...a, type); out.uIN++;
  };
  const rockTop = (x, z) => out.uRock[1] + out.uRockS[1] * Math.sqrt(Math.max(0, 1 - (x / out.uRockS[0]) ** 2 - (z / out.uRockS[2]) ** 2)) * .8;
  // Crystals that grow up and out of the rock, larger in the middle.
  const cluster = (n, size, spread, lean, opts = {}) => {
    for (let i = 0; i < n; i++) {
      const a = r() * Math.PI * 2, d = Math.sqrt(r()) * spread * (i === 0 ? .15 : 1);
      const x = Math.cos(a) * d * out.uRockS[0] * .7, z = Math.sin(a) * d * out.uRockS[2] * .55;
      const dir = unit([x * lean + (r() - .5) * .5, 1.6, z * lean + (r() - .5) * .5 + .15]);
      const s = size * (i === 0 ? 1.25 : .55 + r() * .55);
      const base = [x, rockTop(x, z) - .25 * s, z];
      const q = qMul(qFromYJS(dir), qAxisJS([0, 1, 0], r() * Math.PI));
      add(base, q, s, opts.aspect || aspect, opts.type || 0);
    }
  };
  const h = t.habit, s = t.slug;
  if (['prism6', 'beryl', 'barrel', 'prism3', 'prism4', 'blades', 'prism', 'scalenohedron', 'dipyramid', 'wedge', 'rhombohedron'].includes(h)) {
    const n = { beryl: 6, barrel: 7, prism3: 6, blades: 9, wedge: 5, dipyramid: 7, rhombohedron: 9, scalenohedron: 8, prism: 7 }[h] || 9;
    cluster(n, h === 'blades' ? 1.15 : 1.0, .95, h === 'blades' || h === 'scalenohedron' ? .45 : .3);
    if (s === 'morganite' || s === 'cinnabar' || s === 'ruby') { out.uRockS = [2.4, .8, 1.8]; }
  } else if (['cube', 'octahedron', 'dodecahedron', 'tetrahedron', 'tabular'].includes(h)) {
    // Equant crystals sit on the rock in random turns.
    const n = h === 'tabular' ? 8 : 9;
    for (let i = 0; i < n; i++) {
      const a = r() * Math.PI * 2, d = Math.sqrt(r()) * (i === 0 ? .1 : .9);
      const x = Math.cos(a) * d * out.uRockS[0] * .75, z = Math.sin(a) * d * out.uRockS[2] * .6;
      const sz = (h === 'tabular' ? .95 : 1.0) * (i === 0 ? 1.35 : .5 + r() * .6);
      let q = qMul(qAxisJS(unit([r() - .5, r() - .5, r() - .5]), r() * 6.28), qAxisJS([0, 1, 0], r() * 6.28));
      // Plates stand up at an angle, like wulfenite on its matrix.
      if (h === 'tabular') q = qMul(qAxisJS([0, 1, 0], r() * 6.28), qAxisJS([1, 0, 0], 1.0 + (r() - .5) * .9));
      add([x, rockTop(x, z) + sz * (h === 'tabular' ? .25 : .1), z], q, sz, aspect);
    }
  } else if (h === 'sixling') {
    out.bake = [1, 1, 1];
    // Three plates that cross at 60 degrees, standing on the rock
    for (let k = 0; k < 2; k++) {
      const x = k === 0 ? .2 : -1.5, z = k === 0 ? .3 : -.6, sz = k === 0 ? 1.7 : 1.0;
      const tilt = qMul(qAxisJS([0, 1, 0], r() * 6.28), qAxisJS([1, 0, 0], (r() - .5) * .5));
      for (let i = 0; i < 3; i++) add([x, rockTop(x, z) + sz * .45, z], qMul(tilt, qAxisJS([0, 1, 0], i * Math.PI / 3)), sz, [1, 1, 1]);
    }
  } else if (h === 'cross') {
    // Staurolite: two prisms that cross at right angles
    out.uRock = [0, .5, 0, 1]; out.uRockS = [2.6, .5, 2.0];
    const base = qMul(qAxisJS([0, 1, 0], .5), qAxisJS([1, 0, 0], -.35));
    add([0, 1.9, 0], qMul(base, qAxisJS([0, 0, 1], .0)), 1.25, [1, 1.9, 1]);
    add([0, 1.9, 0], qMul(base, qAxisJS([0, 0, 1], Math.PI / 3)), 1.25, [1, 1.9, 1]);
    // The ends of a prism are flat, so the planes get flat caps.
    out.planes = [...ring(2, 35, 0, .5), ...ring(2, 145, 0, .5), pl([0, 0, 1], .38), pl([0, 0, -1], .38), pl([0, 1, 0], .9), pl([0, -1, 0], .9)];
    out.bake = [1, 1.9, 1];
  } else if (h === 'acicular' || h === 'star') {
    if (s === 'cavansite') {
      // Balls of blue needles on a pale matrix
      for (let i = 0; i < 6; i++) {
        const a = r() * 6.28, d = Math.sqrt(r()) * (i === 0 ? .1 : .85);
        const x = Math.cos(a) * d * 2.0, z = Math.sin(a) * d * 1.3, sz = i === 0 ? .85 : .35 + r() * .35;
        add([x, rockTop(x, z) + sz * .3, z], [0, 0, 0, 1], sz, [1, 1, 1], 4);
      }
    } else if (h === 'star') {
      // Rutile on hematite: golden needles that radiate in six directions
      out.uRock = [0, .35, 0, 1]; out.uRockS = [2.8, .35, 2.1];
      u.cMtx = lin(t.matrix);
      for (let i = 0; i < 18; i++) {
        const a = (i % 6) * Math.PI / 3 + (i >= 6 ? .5 + r() * .3 : r() * .08), len = i < 6 ? 2.1 + r() * .5 : 1.0 + r() * .8;
        const c0 = i < 12 ? [0, .78, 0] : [(r() - .5) * 2.5, .72, (r() - .5) * 1.6];
        const dir = [Math.cos(a), .02, Math.sin(a)];
        add(c0, qFromYJS(dir), 1, [.075 + r() * .03, len * 1.15, 1], 1);
      }
    } else {
      // Sprays of needles that grow from a few points of the rock
      out.bake = s === 'erythrite' ? [.07, 1.7, .03] : s === 'crocoite' ? [.11, 1.5, .11] : [.09, 1.8, .09];
      const centers = s === 'crocoite' ? [[.3, .1], [-1.1, -.3]] : [[.2, .1], [-1.3, -.4], [1.3, -.3]];
      const per = Math.floor(24 / centers.length);
      for (const [cx, cz] of centers) {
        const base = [cx, rockTop(cx, cz) - .2, cz];
        for (let i = 0; i < per; i++) {
          const dir = unit([(r() - .5) * 1.3 + cx * .25, 1.0, (r() - .5) * 1.1 + .2]);
          const len = (s === 'crocoite' ? 1.25 : 1.0) * (.6 + r() * .55);
          add(base, qMul(qFromYJS(dir), qAxisJS([0, 1, 0], r() * 6.28)), len, out.bake);
        }
      }
    }
  } else if (h === 'books') {
    out.bake = [1, 1, 1];
    // Stacks of thin plates, slightly offset like the pages of a book
    const books = s === 'muscovite' ? [[0, 0, 1.25, 9]] : [[.3, .2, .95, 7], [-1.3, -.3, .7, 6], [1.4, -.5, .55, 5]];
    for (const [bx, bz, bs, n] of books) {
      const tilt = qMul(qAxisJS([0, 1, 0], r() * 6.28), qAxisJS(unit([r() - .5, 0, r() - .5]), s === 'muscovite' ? .25 : .35 + r() * .5));
      const up = qApply(tilt, [0, 1, 0]);
      for (let i = 0; i < n; i++) {
        const off = i * bs * .12, jit = (r() - .5) * .06 * bs;
        // Muscovite stands alone on the floor; the other books sit on their rock.
        const y0 = s === 'muscovite' ? bs * .35 : rockTop(bx, bz) + .05;
        const pos = [bx + up[0] * off + jit, y0 + up[1] * off, bz + up[2] * off + jit];
        add(pos, qMul(tilt, qAxisJS([0, 1, 0], (r() - .5) * .12)), bs * (1 - i * .02), [1, 1, 1]);
      }
    }
    if (s === 'muscovite') out.uRock = [0, 0, 0, 0];
  } else if (h === 'botryoidal') {
    // Smooth balls of many sizes that melt together
    out.uHabit = 1;
    out.uRock = [0, 1.2, 0, 0];
    for (let i = 0; i < 18; i++) {
      const a = r() * 6.28, d = Math.sqrt(r());
      const x = Math.cos(a) * d * 2.2, z = Math.sin(a) * d * 1.5, sz = .55 + r() * .65;
      add([x, .9 + sz * .5 + (1 - d) * .7, z], [0, 0, 0, 1], sz, [1, 1, 1], 2);
    }
    // Malachite shows a polished cut through its bands.
    if (s === 'malachite') out.uCut = [...unit([.25, .35, 1]), .6];
  } else if (h === 'massive') {
    out.uHabit = 2;
    out.uRock = [0, 1.55, 0, 1]; out.uRockS = [2.6, 1.55, 1.9];
    out.uCut = [...unit([.12, .55, .85]), .95];
  } else if (h === 'geode') {
    out.uHabit = 3;
    out.uRock = [0, 2.5, -.3, 2.8]; out.uRockS = [1, 1, 1];
    out.uCut = [...unit([.38, .32, 1]), .15];
    out.uPA = s === 'celestine' ? [1, .9, 1] : [1, 1.2, 1];
    out.bake = out.uPA;
  } else if (h === 'druse') {
    out.uHabit = 4;
    out.uRock = [0, .2, 0, 1]; out.uRockS = [2.5, 1.0, 1.9];
    out.bake = [1, 1, 1];
  } else if (h === 'nugget') {
    out.uHabit = 5;
    out.uRock = [0, 1.0, 0, 1]; out.uRockS = [1.9, 1.0, 1.35];
  } else if (h === 'meteorite') {
    out.uHabit = 6;
    out.uRock = [0, 1.5, 0, 1]; out.uRockS = [2.7, 1.5, 1.9];
    out.uCut = [...unit([.15, .3, 1]), .7];
  } else if (h === 'dendrite') {
    // Branches of copper, or curled wires of silver
    out.uHabit = 7;
    out.uRock = [0, .45, 0, 1]; out.uRockS = [2.2, .5, 1.6];
    const wire = s === 'silver';
    const grow = (p, dir, len, rad, depth) => {
      if (out.uIN >= 24 || depth > 3) return;
      const segs = wire ? 4 : 1;
      let pos = p, d = dir;
      for (let k = 0; k < segs && out.uIN < 24; k++) {
        add(pos, qFromYJS(d), 1, [rad, len / segs, 1], 1);
        pos = pos.map((v, i) => v + d[i] * len / segs);
        if (wire) d = unit([d[0] + (r() - .5) * .9, d[1] + (r() - .5) * .3, d[2] + (r() - .5) * .9]);
      }
      if (wire) return;
      const kids = depth === 0 ? 4 : 2;
      for (let k = 0; k < kids; k++) {
        const f = .35 + .6 * (k + r() * .5) / kids;
        const bp = p.map((v, i) => v + dir[i] * len * f);
        const nd = unit([dir[0] + (r() - .5) * 1.6, dir[1] * .7 + .2, dir[2] + (r() - .5) * 1.6]);
        grow(bp, nd, len * .55, rad * .7, depth + 1);
      }
    };
    if (wire) for (let i = 0; i < 6; i++) grow([(r() - .5) * 1.8, .7, (r() - .5) * 1.0], unit([(r() - .5) * .8, 1, (r() - .5) * .6]), 1.5 + r() * 1.3, .12, 0);
    else {
      // Three stems in a fan, each with short side branches on both sides
      for (let k = 0; k < 3; k++) {
        const base = [(k - 1) * .5, .6, 0], dir = unit([(k - 1) * .55, 1, (r() - .5) * .2]);
        const len = 2.6 - Math.abs(k - 1) * .5;
        add(base, qFromYJS(dir), 1, [.17, len, 1], 1);
        for (let j = 0; j < 6 && out.uIN < 24; j++) {
          const f = .2 + j * .13, side = j % 2 ? 1 : -1;
          const bp = base.map((v, i) => v + dir[i] * len * f);
          const bd = unit([dir[0] + side * .9, dir[1] * .6, dir[2] + (r() - .5) * .3]);
          add(bp, qFromYJS(bd), 1, [.1, len * (.42 - j * .04), 1], 1);
        }
      }
    }
  } else if (h === 'hopper') {
    // Bismuth: hopper crystals that step up and out
    for (let i = 0; i < 5; i++) {
      const x = [0, -1.5, 1.4, -.4, .9][i], z = [0, -.4, -.5, -1.3, .9][i], y = [.55, .35, .3, .9, .2][i], sz = [1.45, 1.0, .9, .85, .7][i];
      add([x, y, z], qMul(qAxisJS([0, 1, 0], r() * 6.28), qAxisJS(unit([r() - .5, 0, r() - .5]), .5 + r() * .5)), sz, [1.1, 1.1, 1.1], 3);
    }
    out.uRock = [0, 0, 0, 0];
  }
  return out;
}

// The shape of a single piece for the wordmark and the rough scenes, how it
// rests on the table, and the radius of a sphere around it (uPieceR).
function pieceFor(t, planes, aspect) {
  const out = pieceShape(t, planes, aspect);
  if (out.uPiece === 0 || out.uPiece === 6 || out.uPiece === 7) {
    const v = vertices(planes, out.uPA);
    const r = Math.max(...v.map(p => Math.hypot(...p)));
    out.uPieceR = (out.uPiece === 6 ? r : r) + .05;
  } else out.uPieceR = { 1: 1.05, 2: 1.0, 3: 1.25, 4: 1.15, 5: 1.1 }[out.uPiece];
  return out;
}
function pieceShape(t, planes, aspect) {
  const h = t.habit, s = t.slug;
  const out = { uPiece: 0, uPA: aspect, uPieceK: .58 };
  if (['massive', 'botryoidal', 'meteorite'].includes(h)) { out.uPiece = 1; out.uRestH = .55; out.uRest = [0, 0, 0, 1]; out.uPieceK = .5; return out; }
  if (h === 'nugget' || h === 'dendrite') { out.uPiece = 3; out.uRestH = .5; out.uRest = [0, 0, 0, 1]; out.uPieceK = .46; return out; }
  if (s === 'cavansite') { out.uPiece = 4; out.uRestH = .7; out.uRest = [0, 0, 0, 1]; out.uPieceK = .45; return out; }
  if (h === 'hopper') { out.uPiece = 5; out.uRestH = .1; out.uRest = [0, 0, 0, 1]; out.uPieceK = .55; return out; }
  if (h === 'cross') { out.uPiece = 6; out.uPA = [1, 1.9, 1]; out.uRest = qAxisJS([1, 0, 0], Math.PI / 2); out.uRestH = .42; out.uPieceK = .4; return out; }
  if (h === 'sixling') { out.uPiece = 7; out.uPA = [1, 1, 1]; out.uRest = [0, 0, 0, 1]; out.uRestH = .62; out.uPieceK = .5; return out; }
  // A crystal: find the face that points down when it lies on its side, and
  // the height of its middle above the table.
  let a = aspect.slice();
  if (['acicular', 'star'].includes(h)) a = [.14, 1.6, .14];
  if (h === 'books') a = [.6, 1, .6];
  if (h === 'druse') a = [1, 1, 1];
  out.uPA = a;
  // Long crystals lie on a side face. Equant ones rest on any face.
  const long = a[1] > 1.3 || ['prism6', 'beryl', 'prism3', 'prism4', 'blades', 'prism', 'scalenohedron', 'acicular', 'star', 'geode'].includes(h);
  let rest = [0, 0, 0, 1];
  if (long) rest = qAxisJS([0, 0, 1], Math.PI / 2);
  if (h === 'books' || h === 'tabular') rest = [0, 0, 0, 1];
  // The rest height: the lowest point of the shape after the turn, from the planes.
  const verts = vertices(planes, a);
  let minY = 0;
  for (const v of verts) minY = Math.min(minY, qApply(rest, v)[1]);
  out.uRest = rest; out.uRestH = -minY * .98;
  if (['acicular', 'star'].includes(h)) out.uPieceK = .5;
  if (h === 'books') out.uPieceK = .5;
  return out;
}
